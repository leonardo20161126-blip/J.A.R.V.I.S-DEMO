<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JARVIS | Central de Comando</title>
  <style>
    body {
      margin: 0;
      background: #080f1c;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    main {
      max-width: 600px;
      margin: 70px auto;
      padding: 20px;
    }
    h1 {
      color: #00cfff;
      font-size: 48px;
      letter-spacing: 5px;
    }
    .card {
      background: #142235;
      border: 1px solid #244661;
      border-radius: 16px;
      padding: 24px;
      margin-top: 24px;
    }
    button {
      background: #00cfff;
      color: #07111c;
      padding: 14px 24px;
      border: none;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <h1>JARVIS</h1>
    <p>Seu assistente pessoal inteligente</p>
    <div class="card">
      <h2>Central de Comando</h2>
      <p id="mensagem">Sistemas prontos, senhor.</p>
      <button onclick="iniciar()">
        Iniciar JARVIS
      </button>
    </div>
  </main>
  <script>
    function iniciar() {
      document.getElementById("mensagem").textContent =
        "Bem-vindo, comandante. Vamos construir algo extraordinário.";
    }
 
<script>
function iniciar() {
  document.querySelector(".card").innerHTML = `
    <h2>Chat do JARVIS</h2>
    <p>Sistemas de comunicação iniciados, senhor.</p>
    <div id="conversa" style="min-height:120px; text-align:left; margin:20px 0;"></div>
    <input id="mensagemUsuario" type="text"
      placeholder="Digite sua mensagem..."
      style="padding:12px; max-width:85%; border-radius:8px; border:none;">
    <button onclick="enviar()">Enviar</button>
  `;
}

function enviar() {
  const campo = document.getElementById("mensagemUsuario");
  const mensagem = campo.value.trim();
  if (!mensagem) return;

  const conversa = document.getElementById("conversa");

  const usuario = document.createElement("p");
  usuario.textContent = "Você: " + mensagem;
  conversa.appendChild(usuario);

  const jarvis = document.createElement("p");
  jarvis.textContent = "JARVIS: Mensagem recebida, senhor. Minha inteligência ainda está em desenvolvimento.";
  conversa.appendChild(jarvis);

  campo.value = "";
}
</script>

</body>
</html>
